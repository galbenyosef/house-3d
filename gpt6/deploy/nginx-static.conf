server {
    listen 80;
    server_name _;
    root /srv/housegpt/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json model/gltf-binary;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600";
    }
}
