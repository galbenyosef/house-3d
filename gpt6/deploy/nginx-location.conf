    # HouseGPT: independent static app; existing root and API routes stay in place.
    location = /housegpt {
        return 301 /housegpt/;
    }
    location ^~ /housegpt/ {
        proxy_pass http://housegpt-web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
